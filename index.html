<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TeraBox Video Player & Downloader – Watch Online</title>
<meta name="description" content="Play and download TeraBox videos instantly. Fast, secure, and free TeraBox video player with HD streaming."/>

<link rel="canonical" href="https://teraboxplay.xyz/" />

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: radial-gradient(circle at top, #0f1b3d, #050814);
  color: white;
  overflow-x: hidden;
}

/* Header */
.header {
  width: 100%;
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10,15,35,0.6);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(90deg, #4da3ff, #9b5cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav a {
  color: #cbd5ff;
  margin-left: 20px;
  text-decoration: none;
  font-size: 14px;
}

/* Container */
.container {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 15px;
  background: linear-gradient(90deg, #4da3ff, #9b5cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtext {
  color: #cbd5ff;
  margin-bottom: 40px;
}

/* Glass card */
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

input {
  width: 85%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  margin-bottom: 15px;
  outline: none;
}

/* Thumbnail preview */
.thumbnail {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 15px;
  display: none;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  padding: 14px 30px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.play {
  background: linear-gradient(90deg, #3a7cff, #6b4dff);
  color: white;
}

.download {
  background: linear-gradient(90deg, #ff7a18, #ff3d3d);
  color: white;
}

/* Telegram button */
.telegram-btn {
  background: linear-gradient(90deg, #0088cc, #00aaff);
  color: white;
}

/* Ad blocks */
.ad-box {
  margin: 25px 0;
  padding: 20px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  text-align: center;
  font-size: 14px;
  color: #aaa;
}

footer {
  margin-top: 70px;
  padding: 20px;
  color: #aaa;
  font-size: 14px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">TeraBoxPlay</div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/faq.html">FAQ</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
  </nav>
</header>

<div class="container">

  <h1>TeraBox Video Player & Downloader</h1>
  <p class="subtext">
    Watch and download TeraBox videos instantly without installing any app.
  </p>

  <!-- Top Ad -->
  <div class="ad-box">
    Ad space (728x90 banner)
  </div>

  <div class="card">
    <input id="url" placeholder="Paste your TeraBox link here..." />

    <!-- Thumbnail -->
    <img id="thumb" class="thumbnail" />

    <div class="buttons">
      <button class="play" onclick="play()">▶ Play</button>
      <button class="download" onclick="download()">⬇ Download</button>
      <button class="telegram-btn" onclick="shareTG()">📤 Telegram</button>
    </div>
  </div>

  <!-- Bottom Ad -->
  <div class="ad-box">
    Ad space (native or rectangle)
  </div>

  <footer>
    © 2026 teraboxplay.xyz
  </footer>

</div>

<script>
const input = document.getElementById("url");
const thumb = document.getElementById("thumb");

/* Thumbnail preview */
input.addEventListener("input", () => {
  const url = input.value.trim();
  if (url.includes("http")) {
    thumb.src = "https://via.placeholder.com/800x450?text=Video+Preview";
    thumb.style.display = "block";
  } else {
    thumb.style.display = "none";
  }
});

function play() {
  let url = input.value;
  if(!url) return alert("Paste link first");
  window.location.href = "/player.html?url=" + encodeURIComponent(url);
}

function download() {
  let url = input.value;
  if(!url) return alert("Paste link first");
  window.location.href = "/player.html?download=1&url=" + encodeURIComponent(url);
}

/* Telegram share */
function shareTG() {
  let url = input.value;
  if(!url) return alert("Paste link first");
  const share = "https://t.me/share/url?url=" + encodeURIComponent(url);
  window.open(share, "_blank");
}
</script>

</body>
</html>
