<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>TeraBox Video Player</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #070b1a, #0f1b3d);
  color: white;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 15px;
}

h1 {
  font-size: 28px;
  margin-bottom: 20px;
}

.player-box {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 15px;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

video {
  width: 100%;
  border-radius: 10px;
}

.download-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 25px;
  background: linear-gradient(90deg, #ff7a18, #ff3d3d);
  color: white;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.ad-box {
  margin: 30px 0;
  padding: 20px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Streaming Video</h1>

  <div class="player-box">
    <video id="video" controls autoplay></video>
  </div>

  <div id="downloadSection"></div>

  <div class="ad-box">
    <!-- AdSense ad will go here later -->
    Advertisement space
  </div>

</div>

<script>
function getParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(name);
}

const videoUrl = getParam("url");
const download = getParam("download");

if (videoUrl) {
  const video = document.getElementById("video");
  video.src = videoUrl;

  if (download) {
    document.getElementById("downloadSection").innerHTML =
      `<a class="download-btn" href="${videoUrl}" download>
        ⬇ Download Video
      </a>`;
  }
} else {
  document.body.innerHTML = "<h2>No video link provided.</h2>";
}
</script>

</body>
</html>
