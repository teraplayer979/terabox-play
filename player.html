<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TeraBox Player – Watch Online</title>

<link rel="manifest" href="/manifest.json">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: radial-gradient(circle at top, #0f1b3d, #050814);
  color: white;
}

/* Header */
.header {
  width: 100%;
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10,15,35,0.6);
  backdrop-filter: blur(12px);
}

.logo {
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(90deg, #4da3ff, #9b5cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav a {
  color: #cbd5ff;
  margin-left: 20px;
  text-decoration: none;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

.player-card {
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

video {
  width: 100%;
  border-radius: 12px;
  background: black;
}

/* Skeleton loader */
.skeleton {
  width: 100%;
  height: 360px;
  border-radius: 12px;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.05) 25%,
    rgba(255,255,255,0.15) 50%,
    rgba(255,255,255,0.05) 75%
  );
  background-size: 200% 100%;
  animation: loading 1.2s infinite;
}

@keyframes loading {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

.video-title {
  margin: 15px 0;
  font-size: 20px;
}

/* Buttons */
.buttons, .player-actions {
  text-align: center;
  margin-top: 15px;
}

button {
  padding: 12px 24px;
  margin: 8px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: linear-gradient(90deg, #3a7cff, #6b4dff);
  color: white;
}

.download-btn {
  background: linear-gradient(90deg, #ff7a18, #ff3d3d);
}

/* Focus mode */
.focus-mode {
  background: black !important;
}

.focus-mode .header,
.focus-mode footer,
.focus-mode .comments,
.focus-mode .history {
  display: none;
}

/* Comments */
.comments {
  margin-top: 40px;
}

.comments textarea {
  width: 100%;
  height: 80px;
  border-radius: 10px;
  border: none;
  padding: 10px;
  margin-top: 10px;
}

.comment {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}

/* History */
.history {
  margin-top: 40px;
}

.history a {
  display: block;
  color: #a78bfa;
  margin: 6px 0;
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 30px;
  color: #aaa;
  margin-top: 60px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">TeraBoxPlay</div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/about.html">About</a>
    <a href="/contact.html">Contact</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
  </nav>
</header>

<div class="container">

  <div class="player-card">

    <!-- Skeleton -->
    <div id="skeleton" class="skeleton"></div>

    <!-- Title -->
    <h2 id="videoTitle" class="video-title"></h2>

    <!-- Video -->
    <video id="videoPlayer" controls></video>

    <!-- Actions -->
    <div class="player-actions">
      <button onclick="copyLink()">🔗 Copy Share Link</button>
      <button onclick="toggleFocus()">🌙 Focus Mode</button>
      <button id="installBtn" style="display:none;">📲 Install App</button>
    </div>

  </div>

  <!-- Main buttons -->
  <div class="buttons">
    <button onclick="goHome()">⬅ Back to Home</button>
    <button class="download-btn" id="downloadBtn">⬇ Download</button>
  </div>

  <!-- Comments -->
  <div class="comments">
    <h3>Comments</h3>
    <textarea id="commentInput" placeholder="Write a comment..."></textarea>
    <button onclick="addComment()">Post Comment</button>
    <div id="commentList"></div>
  </div>

  <!-- History -->
  <div class="history" id="historyBox"></div>

</div>

<footer>
  © 2026 teraboxplay.xyz
</footer>

<script>
function getParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

const videoUrl = getParam("url");
const player = document.getElementById("videoPlayer");
const downloadBtn = document.getElementById("downloadBtn");
const skeleton = document.getElementById("skeleton");
const titleEl = document.getElementById("videoTitle");

if (videoUrl) {
  player.src = videoUrl;
  downloadBtn.onclick = () => window.open(videoUrl, "_blank");

  try {
    const name = decodeURIComponent(videoUrl.split("/").pop().split("?")[0]);
    titleEl.textContent = name;
  } catch {
    titleEl.textContent = "TeraBox Video";
  }
}

/* Hide skeleton */
player.addEventListener("loadeddata", () => {
  skeleton.style.display = "none";
});

/* Resume playback */
const videoKey = "video_" + videoUrl;

player.addEventListener("loadedmetadata", () => {
  const savedTime = localStorage.getItem(videoKey);
  if (savedTime) player.currentTime = savedTime;
});

player.addEventListener("timeupdate", () => {
  localStorage.setItem(videoKey, player.currentTime);
});

/* History */
if (videoUrl) {
  let history = JSON.parse(localStorage.getItem("history") || "[]");
  history = history.filter(item => item !== videoUrl);
  history.unshift(videoUrl);
  if (history.length > 5) history.pop();
  localStorage.setItem("history", JSON.stringify(history));
}

const historyBox = document.getElementById("historyBox");
let history = JSON.parse(localStorage.getItem("history") || "[]");

if (history.length > 0) {
  historyBox.innerHTML = "<h3>Recently Viewed</h3>";
  history.forEach(link => {
    historyBox.innerHTML +=
      `<a href="/player.html?url=${encodeURIComponent(link)}">${link}</a>`;
  });
}

/* Copy link */
function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied!");
}

/* Focus mode */
function toggleFocus() {
  document.body.classList.toggle("focus-mode");
}

/* Comments */
function addComment() {
  const input = document.getElementById("commentInput");
  const text = input.value.trim();
  if (!text) return;

  let comments = JSON.parse(localStorage.getItem("comments") || "[]");
  comments.unshift(text);
  localStorage.setItem("comments", JSON.stringify(comments));
  input.value = "";
  loadComments();
}

function loadComments() {
  const list = document.getElementById("commentList");
  let comments = JSON.parse(localStorage.getItem("comments") || "[]");
  list.innerHTML = "";
  comments.slice(0,10).forEach(c => {
    const div = document.createElement("div");
    div.className = "comment";
    div.textContent = c;
    list.appendChild(div);
  });
}
loadComments();

/* PWA install */
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
});

function goHome() {
  window.location.href = "/";
}
</script>

</body>
</html>
