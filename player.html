<script>
// OPTIMIZATION: Trigger API Fetch Immediately
const VIDEO_URL = new URL(location.href).searchParams.get("url");
const CACHE_KEY = "stream_" + VIDEO_URL;
const CACHE_TIME = 6 * 60 * 60 * 1000; // 6 hours

const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
const now = Date.now();

if (cached && (now - cached.time < CACHE_TIME)) {
  window.videoPromise = Promise.resolve(cached.data);
} else {
  // Start fetch before DOM parses
  window.videoPromise = fetch("https://github-backend00.onrender.com/api", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: VIDEO_URL })
  })
  .then(res => res.json())
  .then(data => {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      data: data,
      time: Date.now()
    }));
    return data;
  })
  .catch(() => null);
}
</script>

<header class="header">

<script>
// --- UI References ---
const player = document.getElementById("videoPlayer");
const titleBox = document.getElementById("videoTitle");
const loader = document.getElementById("playerLoader");
const qualityBtn = document.getElementById("qualityBtn");
const qualityMenu = document.getElementById("qualityOptions");

// --- State ---
let availableStreams = {};

// --- Utilities ---
function getParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied");
}

function shareTelegram(){
  const share="https://t.me/share/url?url="+encodeURIComponent(window.location.href);
  window.open(share,"_blank");
}

function toggleFocus(){
  document.body.classList.toggle("focus-mode");
}

// --- Player Logic ---
const teraboxLink = getParam("url");

// Set initial title if possible
if (teraboxLink && titleBox) {
  try {
    const name = decodeURIComponent(teraboxLink.split("/").pop());
    titleBox.innerText = name.substring(0, 60);
  } catch {
    titleBox.innerText = "TeraBox Video";
  }
}

async function initPlayer() {
  if (!teraboxLink) return;

  try {
    const data = await window.videoPromise;
    if (!data || !data.list || !data.list[0]) throw new Error("Video not found");

    const file = data.list[0];
    
    // Update Title from API
    if (file.filename) titleBox.innerText = file.filename.substring(0, 60);

    // Parse streams
    const fastStreams = file.fast_stream_url || {};
    
    // Store for quality switching
    availableStreams = {
      "360p": fastStreams["360p"],
      "480p": fastStreams["480p"],
      "720p": fastStreams["720p"],
      "default": file.stream_url || file.download_link
    };

    // OPTIMIZATION: Strict Priority -> 360p is KING for speed
    const startStream = 
      availableStreams["360p"] || 
      availableStreams["480p"] || 
      availableStreams["720p"] || 
      availableStreams["default"];

    if (!startStream) throw new Error("No stream available");

    // Apply Source and Load Immediately
    player.src = startStream;
player.play().catch(()=>{}); // Force browser to start buffering

    // Attempt autoplay (Muted is already set in HTML for higher success rate)
    const playPromise = player.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Autoplay blocked - unmuting on click handled by listener below
        console.log("Autoplay blocked waiting for user");
      });
    }

  } catch (err) {
    console.error("Player Error:", err);
    // Hide loader if error so user sees controls (or lack thereof)
    loader.style.display = "none";
  }
}

// --- Quality Switcher ---
qualityBtn.onclick = () => {
  qualityMenu.style.display = (qualityMenu.style.display === "block") ? "none" : "block";
};

qualityMenu.querySelectorAll("div").forEach(opt => {
  opt.onclick = () => {
    const q = opt.dataset.q;
    const time = player.currentTime;
    const isPlaying = !player.paused;

    // Fallback logic for switcher
    const newStream = 
      availableStreams[q] || 
      availableStreams["360p"] || 
      availableStreams["480p"] || 
      availableStreams["default"];

    if (newStream && player.src !== newStream) {
      player.src = newStream;
      player.currentTime = time;
      if (isPlaying) player.play();
      qualityBtn.textContent = q + " ⚙️";
    }
    
    qualityMenu.style.display = "none";
  };
});

// --- Event Listeners ---
player.addEventListener("canplay", () => {
  loader.style.display = "none";
});

player.addEventListener("waiting", () => {
  loader.style.display = "flex";
});

player.addEventListener("playing", () => {
  loader.style.display = "none";
});

// Unmute on first manual interaction if autoplay was muted
player.addEventListener("play", () => {
  if(player.muted) player.muted = false;
});

// Initialize
initPlayer();
</script>
