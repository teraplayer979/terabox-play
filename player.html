<script>
const VIDEO_URL = new URL(location.href).searchParams.get("url");
const CACHE_KEY = "stream_" + VIDEO_URL;
const CACHE_TIME = 60 * 60 * 1000;

const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
const now = Date.now();

if (cached && (now - cached.time < CACHE_TIME)) {
  window.videoPromise = Promise.resolve(cached.data);
} else {
  window.videoPromise = fetch("https://github-backend00.onrender.com/api",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url: VIDEO_URL})
  })
  .then(res => res.json())
  .then(data => {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      data: data,
      time: Date.now()
    }));
    return data;
  })
  .catch(()=>null);
}
</script>

<script>
function getParam(name){
const url=new URL(window.location.href);
return url.searchParams.get(name);
}

const teraboxLink=getParam("url");
const downloadMode=getParam("download");
const player=document.getElementById("videoPlayer");
const titleBox=document.getElementById("videoTitle");
const loader=document.getElementById("loader");

if(teraboxLink && titleBox){
try{
const name=decodeURIComponent(teraboxLink.split("/").pop());
titleBox.innerText=name.substring(0,60);
}catch{
titleBox.innerText="TeraBox Video";
}
}

async function loadVideo(){
if(!teraboxLink) return;

const data = await window.videoPromise;
if(!data || !data.list || !data.list[0]) return;

const file=data.list[0];

const stream =
file.fast_stream_url?.["360p"] ||
file.fast_stream_url?.["480p"] ||
file.fast_stream_url?.["720p"] ||
file.stream_url;

if(!stream) return;

if(downloadMode){
window.location.href = file.download_link || stream;
return;
}

player.src = stream;
player.muted = true;
player.play().catch(()=>{});
}

loadVideo();

player.addEventListener("playing",()=>{
loader.style.display="none";
});

player.addEventListener("loadedmetadata",()=>{
const key="time_"+player.src;
const saved=localStorage.getItem(key);
if(saved) player.currentTime=saved;
});

player.addEventListener("timeupdate",()=>{
const key="time_"+player.src;
localStorage.setItem(key,player.currentTime);
});

function copyLink(){
navigator.clipboard.writeText(window.location.href);
alert("Link copied");
}

function shareTelegram(){
const share="https://t.me/share/url?url="+encodeURIComponent(window.location.href);
window.open(share,"_blank");
}

function toggleFocus(){
document.body.classList.toggle("focus-mode");
}

function addComment(){
const input=document.getElementById("commentInput");
if(!input.value) return;
let comments=JSON.parse(localStorage.getItem("comments")||"[]");
comments.unshift(input.value);
localStorage.setItem("comments",JSON.stringify(comments));
renderComments();
input.value="";
}

function renderComments(){
const list=document.getElementById("commentList");
let comments=JSON.parse(localStorage.getItem("comments")||"[]");
list.innerHTML="";
comments.forEach(c=>{
list.innerHTML+=`<div class="comment">${c}</div>`;
});
}
renderComments();
</script>
