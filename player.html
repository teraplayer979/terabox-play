<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script>
const VIDEO_URL = new URL(location.href).searchParams.get("url");
const CACHE_KEY = "stream_" + VIDEO_URL;
const CACHE_TIME = 60 * 60 * 1000;

const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
const now = Date.now();

if (cached && (now - cached.time < CACHE_TIME)) {
  window.videoPromise = Promise.resolve(cached.data);
} else {
  window.videoPromise = fetch("https://github-backend00.onrender.com/api",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url: VIDEO_URL})
  })
  .then(res => res.json())
  .then(data => {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      data: data,
      time: Date.now()
    }));
    return data;
  })
  .catch(()=>null);
}
</script>

<title>TeraBox Player</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050814;color:white;}
.header{padding:18px 30px;display:flex;justify-content:space-between;background:#0f1b3d;}
.logo{font-size:22px;font-weight:bold;color:#4da3ff;}
.container{max-width:1000px;margin:auto;padding:40px 20px;}
.player-card{background:rgba(255,255,255,0.05);border-radius:18px;padding:20px;}
video{width:100%;border-radius:12px;background:black;}

.player-actions{text-align:center;margin-top:15px;}
.player-actions button{margin:5px;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;}

.notice-box{
  background:linear-gradient(90deg,#4da3ff,#9b5cff);
  padding:12px;
  border-radius:10px;
  text-align:center;
  margin-bottom:15px;
}

.quality-menu{
  position:absolute;
  bottom:15px;
  right:15px;
}

#qualityBtn{
  background:rgba(0,0,0,0.6);
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
}

.quality-options{
  display:none;
  position:absolute;
  bottom:40px;
  right:0;
  background:#111;
  border-radius:8px;
}

.quality-options div{
  padding:8px 14px;
  cursor:pointer;
}

.ad-box{margin:25px 0;text-align:center;}
.comment{background:#111;padding:10px;margin-top:10px;border-radius:8px;}
.comment-box{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;}
</style>
</head>

<body>

<header class="header">
  <div class="logo">TeraBoxPlay</div>
</header>

<div class="container">

<div class="ad-box">
<script src="//www.highperformanceformat.com/07f225439358aa450e7cfdd702a47568/invoke.js"></script>
</div>

<div class="player-card">

<div class="notice-box">
⏳ 5–6 seconds wait karein… video automatically start ho jayegi.
</div>

<h2 id="videoTitle"></h2>

<div style="position:relative;">
<video id="videoPlayer" controls preload="auto" playsinline muted></video>

<div class="quality-menu">
<button id="qualityBtn">360p ⚙️</button>
<div id="qualityOptions" class="quality-options">
<div data-q="360p">360p (Fast)</div>
<div data-q="480p">480p</div>
<div data-q="720p">720p HD</div>
</div>
</div>
</div>

<div class="player-actions">
<button onclick="copyLink()">🔗 Copy Link</button>
<button onclick="toggleFocus()">🌙 Focus</button>
<button onclick="shareTelegram()">📤 Telegram</button>
</div>

</div>

<div class="comments">
<h3>Comments</h3>
<input id="commentInput" class="comment-box" placeholder="Write comment..." />
<button onclick="addComment()">Post</button>
<div id="commentList"></div>
</div>

</div>

<script>
const player = document.getElementById("videoPlayer");
const titleBox = document.getElementById("videoTitle");
let streams = {};

async function loadVideo(){
  const url = new URL(location.href).searchParams.get("url");
  if(!url) return;

  const data = await window.videoPromise;
  if(!data || !data.list || !data.list[0]) return;

  const file = data.list[0];
  streams = file.fast_stream_url || {};

  const stream =
    streams["360p"] ||
    streams["480p"] ||
    streams["720p"] ||
    file.stream_url;

  player.src = stream;
  player.muted = true;
  player.play().catch(()=>{});

  setupQuality();
}

function setupQuality(){
  const btn = document.getElementById("qualityBtn");
  const menu = document.getElementById("qualityOptions");

  btn.onclick = ()=>{
    menu.style.display = menu.style.display==="block"?"none":"block";
  };

  menu.querySelectorAll("div").forEach(opt=>{
    opt.onclick=()=>{
      const q = opt.dataset.q;
      const time = player.currentTime;

      const newStream = streams[q];
      if(newStream){
        player.src = newStream;
        player.currentTime = time;
        player.play();
        btn.textContent = q+" ⚙️";
      }

      menu.style.display="none";
    };
  });
}

function copyLink(){
  navigator.clipboard.writeText(location.href);
  alert("Link copied");
}

function shareTelegram(){
  window.open("https://t.me/share/url?url="+encodeURIComponent(location.href));
}

function toggleFocus(){
  document.body.style.background = "black";
}

function addComment(){
  const input = document.getElementById("commentInput");
  if(!input.value) return;

  let comments = JSON.parse(localStorage.getItem("comments")||"[]");
  comments.unshift(input.value);
  localStorage.setItem("comments",JSON.stringify(comments));
  renderComments();
  input.value="";
}

function renderComments(){
  const list=document.getElementById("commentList");
  let comments=JSON.parse(localStorage.getItem("comments")||"[]");
  list.innerHTML="";
  comments.forEach(c=>{
    list.innerHTML+=`<div class="comment">${c}</div>`;
  });
}

renderComments();
loadVideo();
</script>
