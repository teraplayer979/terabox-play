<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TeraBox Player – Watch Online</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: radial-gradient(circle at top, #0f1b3d, #050814);
  color: white;
}

/* Header */
.header {
  width: 100%;
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10,15,35,0.6);
  backdrop-filter: blur(12px);
}

.logo {
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(90deg, #4da3ff, #9b5cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav a {
  color: #cbd5ff;
  margin-left: 20px;
  text-decoration: none;
}

/* Container */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

/* Player card */
.player-card {
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

video {
  width: 100%;
  border-radius: 12px;
  background: black;
}

/* Skeleton loader */
.skeleton {
  width: 100%;
  height: 300px;
  border-radius: 12px;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.05) 25%,
    rgba(255,255,255,0.1) 50%,
    rgba(255,255,255,0.05) 75%
  );
  background-size: 200% 100%;
  animation: skeleton 1.5s infinite;
}

@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Thumbnail */
.thumbnail {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 15px;
  display: none;
}

/* Title */
.video-title {
  text-align: center;
  margin: 15px 0;
  font-size: 22px;
}

/* Action buttons */
.player-actions {
  text-align: center;
  margin-top: 15px;
}

.player-actions button {
  margin: 5px;
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.telegram-btn {
  background: linear-gradient(90deg, #0088cc, #00aaff);
  color: white;
}

/* Focus mode */
.focus-mode {
  background: black !important;
}

/* History */
.history {
  margin-top: 40px;
}

.history a {
  display: block;
  color: #a78bfa;
  margin: 6px 0;
  text-decoration: none;
}

/* Comments */
.comments {
  margin-top: 50px;
  text-align: left;
}

.comment-box {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

.comment {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}

/* Ads */
.ad-box {
  margin: 25px 0;
  padding: 20px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  text-align: center;
  color: #aaa;
}

footer {
  text-align: center;
  padding: 30px;
  color: #aaa;
  margin-top: 60px;
}
</style>

</head>

<body>

<header class="header">
  <div class="logo">TeraBoxPlay</div>
  <nav class="nav">
    <a href="/">Home</a>
  </nav>
</header>

<div class="container">

  <div class="ad-box">Ad Space (Top Banner)</div>

  <div class="player-card">

    <div id="skeleton" class="skeleton"></div>

    <img id="thumbnail" class="thumbnail" />
    <h2 id="videoTitle" class="video-title"></h2>

    <video id="videoPlayer" controls></video>

    <div class="player-actions">
      <button onclick="copyLink()">🔗 Copy Share Link</button>
      <button onclick="toggleFocus()">🌙 Focus Mode</button>
      <button class="telegram-btn" onclick="shareTelegram()">📤 Share Telegram</button>
      <button id="installBtn" style="display:none;">📲 Install App</button>
    </div>

  </div>

  <div class="ad-box">Ad Space (Middle)</div>

  <div class="history" id="historyBox"></div>

  <!-- Comments -->
  <div class="comments">
    <h3>Comments</h3>
    <input id="commentInput" class="comment-box" placeholder="Write a comment..." />
    <button onclick="addComment()">Post</button>
    <div id="commentList"></div>
  </div>

  <div class="ad-box">Ad Space (Bottom)</div>

</div>

<footer>
  © 2026 teraboxplay.xyz
</footer>

<script>
function getParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

const videoUrl = getParam("url");
const player = document.getElementById("videoPlayer");
const skeleton = document.getElementById("skeleton");
const thumbnail = document.getElementById("thumbnail");
const title = document.getElementById("videoTitle");

/* Load video */
if (videoUrl) {
  player.src = videoUrl;

  // Thumbnail
  thumbnail.src = videoUrl;
  thumbnail.style.display = "block";

  // Title
  const fileName = decodeURIComponent(videoUrl.split("/").pop());
  title.innerText = fileName;
}

player.addEventListener("loadeddata", () => {
  skeleton.style.display = "none";
});

/* Copy share link */
function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied!");
}

/* Focus mode */
function toggleFocus() {
  document.body.classList.toggle("focus-mode");
}

/* Telegram share */
function shareTelegram() {
  const shareUrl = encodeURIComponent(window.location.href);
  window.open(`https://t.me/share/url?url=${shareUrl}`, "_blank");
}

/* Resume playback */
const videoKey = "video_" + videoUrl;

player.addEventListener("loadedmetadata", () => {
  const savedTime = localStorage.getItem(videoKey);
  if (savedTime) {
    player.currentTime = savedTime;
  }
});

player.addEventListener("timeupdate", () => {
  localStorage.setItem(videoKey, player.currentTime);
});

/* History */
if (videoUrl) {
  let history = JSON.parse(localStorage.getItem("history") || "[]");
  history = history.filter(item => item !== videoUrl);
  history.unshift(videoUrl);
  if (history.length > 5) history.pop();
  localStorage.setItem("history", JSON.stringify(history));
}

const historyBox = document.getElementById("historyBox");
let history = JSON.parse(localStorage.getItem("history") || "[]");

if (history.length > 0) {
  historyBox.innerHTML = "<h3>Recently Viewed</h3>";
  history.forEach(link => {
    historyBox.innerHTML +=
      `<a href="/player.html?url=${encodeURIComponent(link)}">${link}</a>`;
  });
}

/* Comments */
function addComment() {
  const input = document.getElementById("commentInput");
  const text = input.value;
  if (!text) return;

  let comments = JSON.parse(localStorage.getItem("comments") || "[]");
  comments.push(text);
  localStorage.setItem("comments", JSON.stringify(comments));

  input.value = "";
  renderComments();
}

function renderComments() {
  const list = document.getElementById("commentList");
  list.innerHTML = "";
  let comments = JSON.parse(localStorage.getItem("comments") || "[]");

  comments.forEach(c => {
    list.innerHTML += `<div class="comment">${c}</div>`;
  });
}

renderComments();

/* Install as app */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "inline-block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
});
</script>

</body>
</html>
