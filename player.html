<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script>
const VIDEO_URL = new URL(location.href).searchParams.get("url");
const CACHE_KEY = "stream_" + VIDEO_URL;
const CACHE_TIME = 60 * 60 * 1000;

const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
const now = Date.now();

if (cached && (now - cached.time < CACHE_TIME)) {
  window.videoPromise = Promise.resolve(cached.data);
} else {
  window.videoPromise = fetch("https://github-backend00.onrender.com/api",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url: VIDEO_URL})
  })
  .then(res => res.json())
  .then(data => {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      data: data,
      time: Date.now()
    }));
    return data;
  })
  .catch(()=>null);
}
</script>

<title>TeraBox Player – Watch Online</title>

<link rel="preconnect" href="https://github-backend00.onrender.com">
<link rel="dns-prefetch" href="https://github-backend00.onrender.com">
<link rel="preconnect" href="https://d.terabox.com">
<link rel="dns-prefetch" href="https://d.terabox.com">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:radial-gradient(circle at top,#0f1b3d,#050814);color:white;}
.header{width:100%;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,15,35,0.6);backdrop-filter:blur(12px);}
.logo{font-size:22px;font-weight:bold;background:linear-gradient(90deg,#4da3ff,#9b5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav a{color:#cbd5ff;margin-left:20px;text-decoration:none;}
.container{max-width:1000px;margin:auto;padding:40px 20px;}
.player-card{background:rgba(255,255,255,0.05);border-radius:18px;padding:20px;backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(0,0,0,0.6);}
video{width:100%;border-radius:12px;background:black;}
.video-title{text-align:center;margin:15px 0;font-size:22px;}
.player-actions{text-align:center;margin-top:15px;}
.player-actions button{margin:5px;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;}
.telegram-btn{background:linear-gradient(90deg,#0088cc,#00aaff);color:white;}
.focus-mode{background:black!important;}
footer{text-align:center;padding:30px;color:#aaa;margin-top:60px;}

.notice-box{
  background: linear-gradient(90deg,#4da3ff,#9b5cff);
  padding:12px 16px;
  border-radius:10px;
  text-align:center;
  font-size:15px;
  margin-bottom:15px;
  font-weight:600;
}

.video-wrapper{
  position:relative;
}

/* Loader */
.loader{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.75);
  border-radius:12px;
  z-index:5;
}

.spinner{
  width:60px;
  height:60px;
  border:5px solid rgba(255,255,255,0.2);
  border-top:5px solid #4da3ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.quality-menu{
  position:absolute;
  top:15px;
  right:15px;
  z-index:10;
}

#qualityBtn{
  background:rgba(0,0,0,0.75);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}

.quality-options{
  display:none;
  position:absolute;
  top:45px;
  right:0;
  background:rgba(0,0,0,0.85);
  border-radius:8px;
  overflow:hidden;
}

.quality-options div{
  padding:8px 14px;
  cursor:pointer;
}

.quality-options div:hover{
  background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<header class="header">
<div class="logo">TeraBoxPlay</div>
<nav class="nav">
<a href="/">Home</a>
</nav>
</header>

<div class="container">

<div class="player-card">

<div class="notice-box">
⏳ click on play button video will play after few seconds.
</div>

<h2 id="videoTitle" class="video-title"></h2>

<div class="video-wrapper">

<div id="loader" class="loader">
<div class="spinner"></div>
</div>

<video id="videoPlayer" controls preload="auto" playsinline muted></video>

<div class="quality-menu">
<button id="qualityBtn">360p ⚙️</button>
<div id="qualityOptions" class="quality-options">
<div data-q="360p">360p (Fast)</div>
<div data-q="480p">480p</div>
<div data-q="720p">720p HD</div>
</div>
</div>

</div>

<div class="player-actions">
<button onclick="copyLink()">🔗 Copy Share Link</button>
<button onclick="toggleFocus()">🌙 Focus Mode</button>
<button class="telegram-btn" onclick="shareTelegram()">📤 Share Telegram</button>
</div>

</div>

</div>

<footer>
© 2026 teraboxplay.xyz
</footer>

<script>
function getParam(name){
  return new URL(window.location.href).searchParams.get(name);
}

const teraboxLink=getParam("url");
const player=document.getElementById("videoPlayer");
const titleBox=document.getElementById("videoTitle");
const loader=document.getElementById("loader");

let streams={};

if(teraboxLink && titleBox){
  try{
    const name=decodeURIComponent(teraboxLink.split("/").pop());
    titleBox.innerText=name.substring(0,60);
  }catch{
    titleBox.innerText="TeraBox Video";
  }
}

async function loadVideo(){
  if(!teraboxLink) return;

  const data = await window.videoPromise;
  if(!data || !data.list || !data.list[0]) return;

  const file=data.list[0];
  streams=file.fast_stream_url || {};

  const stream =
    streams["360p"] ||
    streams["480p"] ||
    streams["720p"] ||
    file.stream_url;

  if(!stream) return;

  player.src = stream;
  player.muted = true;
  player.play().catch(()=>{});
}

loadVideo();

/* hide loader when video ready */
player.addEventListener("loadeddata",()=>{
  loader.style.display="none";
});

const btn=document.getElementById("qualityBtn");
const menu=document.getElementById("qualityOptions");

btn.onclick=()=>{
  menu.style.display = menu.style.display==="block"?"none":"block";
};

menu.querySelectorAll("div").forEach(opt=>{
  opt.onclick=()=>{
    const q=opt.dataset.q;
    const time=player.currentTime;

    const newStream=
      streams[q] ||
      streams["360p"] ||
      streams["480p"] ||
      streams["720p"];

    if(newStream){
      player.src=newStream;
      player.currentTime=time;
      player.play();
      btn.textContent=q+" ⚙️";
    }

    menu.style.display="none";
  };
});

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied");
}

function shareTelegram(){
  const share="https://t.me/share/url?url="+encodeURIComponent(window.location.href);
  window.open(share,"_blank");
}

function toggleFocus(){
  document.body.classList.toggle("focus-mode");
}
</script>

</body>
</html>
